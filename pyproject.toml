[project]
name = "funquery"
version = "1.0.5"
description = "Redash API 的 Python 客户端：支持 Query 执行与管理、Dashboard 与 Widget 操作、告警与数据源配置"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [ "funsecret>=1.4.84", "requests>=2.31.0",]
license = "MIT"
license-files = ["LICENSE"]
[[project.authors]]
name = "牛哥"
email = "niuliangtao@qq.com"

[[project.authors]]
name = "farfarfun"
email = "farfarfun@qq.com"
[[project.maintainers]]
name = "牛哥"
email = "niuliangtao@qq.com"

[[project.maintainers]]
name = "farfarfun"
email = "farfarfun@qq.com"
[project.urls]
Organization = "https://github.com/farfarfun"
Repository = "https://github.com/farfarfun/funquery"
Releases = "https://github.com/farfarfun/funquery/releases"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.setuptools]

[dependency-groups]
dev = [ "pytest>=7.0",]
